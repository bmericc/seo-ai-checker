x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      COMPOSER_INSTALL_FLAGS: ${COMPOSER_INSTALL_FLAGS:-}
  restart: ${RESTART_POLICY:-no}
  environment: &app-environment
    APP_NAME: ${APP_NAME}
    APP_ENV: ${APP_ENV}
    APP_DEBUG: ${APP_DEBUG}
    APP_URL: ${APP_URL}
    APP_LOCALE: ${APP_LOCALE}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
    APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
    LOG_CHANNEL: ${LOG_CHANNEL}
    LOG_LEVEL: ${LOG_LEVEL}
    DB_CONNECTION: ${DB_CONNECTION}
    DB_DATABASE: ${DB_DATABASE}
    SESSION_DRIVER: ${SESSION_DRIVER}
    SESSION_LIFETIME: ${SESSION_LIFETIME}
    CACHE_STORE: ${CACHE_STORE}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
    MAIL_MAILER: ${MAIL_MAILER}
    GOOGLE_HL: ${GOOGLE_HL}
    GOOGLE_GL: ${GOOGLE_GL}
    REQUEST_DELAY_MS: ${REQUEST_DELAY_MS}
    HTTP_PROXY: ${HTTP_PROXY}
    SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
    DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN}
    DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD}
    DATAFORSEO_LOCATION_CODE: ${DATAFORSEO_LOCATION_CODE}
    PSI_API_KEY: ${PSI_API_KEY}
    PSI_STRATEGY: ${PSI_STRATEGY}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    BING_CLIENT_ID: ${BING_CLIENT_ID}
    BING_CLIENT_SECRET: ${BING_CLIENT_SECRET}
    ADMIN_EMAILS: ${ADMIN_EMAILS}
  volumes: &app-volumes
    - ./www:/var/www/html
    - vendor:/var/www/html/vendor
    - bootstrap_cache:/var/www/html/bootstrap/cache
    - storage:/var/www/html/storage

services:
  app:
    <<: *app-build

  # Sitemap sayfalari icin toplu Lighthouse (PSI) taramasi gibi uzun suren
  # isleri arka planda isler (bkz. App\Jobs\RunSitemapUrlLighthouseCheck).
  # "app" ile ayni image/volume'leri kullanir, sadece php-fpm yerine
  # queue:work calistirir.
  worker:
    <<: *app-build
    command: ["php", "artisan", "queue:work", "--tries=2", "--sleep=3", "--max-time=3600"]

  # Laravel'in zamanlanmis gorevlerini (bkz. routes/console.php - gunluk
  # site kontrolu) calistirir. Host'ta cron kurmak yerine "app" ile ayni
  # image/volume'leri kullanan bu konteyner, schedule:work ile sureklilik
  # arz eden bir foreground process olarak dakikada bir zamani gelen
  # gorevleri tetikler.
  scheduler:
    <<: *app-build
    command: ["php", "artisan", "schedule:work"]

  webserver:
    image: nginx:1.27-alpine
    restart: ${RESTART_POLICY:-no}
    hostname: ${APP_HOSTNAME:-seo-ai-checker}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./www/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
      proxy:
        aliases:
          - ${APP_HOSTNAME:-seo-ai-checker}
    depends_on:
      - app

volumes:
  vendor:
  bootstrap_cache:
  storage:

networks:
  default: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_proxy}
