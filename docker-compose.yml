services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./www:/var/www/html
      - vendor:/var/www/html/vendor

  webserver:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./www/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  vendor:
