services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        COMPOSER_INSTALL_FLAGS: --no-dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_DATABASE: ${DB_DATABASE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      CACHE_STORE: ${CACHE_STORE}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      MAIL_MAILER: ${MAIL_MAILER}
      GOOGLE_HL: ${GOOGLE_HL}
      GOOGLE_GL: ${GOOGLE_GL}
      REQUEST_DELAY_MS: ${REQUEST_DELAY_MS}
      HTTP_PROXY: ${HTTP_PROXY}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
      PSI_API_KEY: ${PSI_API_KEY}
      PSI_STRATEGY: ${PSI_STRATEGY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS}
    volumes:
      - ./www:/var/www/html
      - vendor_prod:/var/www/html/vendor
      - bootstrap_cache_prod:/var/www/html/bootstrap/cache

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./www/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  vendor_prod:
  bootstrap_cache_prod:
