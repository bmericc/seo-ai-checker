<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.33" stop-color="#EA4335"/>
      <stop offset="0.66" stop-color="#FBBC04"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12161F" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="70" y="80" width="8" height="200" rx="4" fill="url(#bar)"/>

  <!-- logo mark + label -->
  <g transform="translate(100,96)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#4285F4"/>
    <rect x="16" y="0" width="13" height="13" rx="3" fill="#EA4335"/>
    <rect x="0" y="16" width="13" height="13" rx="3" fill="#FBBC04"/>
    <rect x="16" y="16" width="13" height="13" rx="3" fill="#34A853"/>
  </g>
  <text x="142" y="118" font-size="22" font-weight="600" fill="#1A73E8" letter-spacing="2">SEO / AI OVERVIEW CHECKER</text>
  <text x="100" y="185" font-size="52" font-weight="800" fill="#12161F">Sitem Google'da ve</text>
  <text x="100" y="250" font-size="52" font-weight="800" fill="#12161F">yapay zekâda nerede?</text>
  <text x="100" y="300" font-size="22" fill="#586172">Klasik SEO + AI Overview + MCP · açık kaynak</text>

  <!-- chat -->
  <g>
    <rect x="100" y="370" width="420" height="64" rx="18" fill="#1A73E8"/>
    <text x="124" y="410" font-size="20" fill="#ffffff">Sitemde öncelikli sorun ne?</text>
    <rect x="100" y="452" width="540" height="96" rx="18" fill="#F6F7F9" stroke="#E3E6EB"/>
    <text x="124" y="488" font-size="17" fill="#1557B0" font-family="'JetBrains Mono', Menlo, monospace">→ get_domain("ornekmagaza.com")</text>
    <text x="124" y="522" font-size="19" fill="#3B4352">robots.txt GPTBot ve ClaudeBot'u engelliyor.</text>
  </g>

  <!-- dashboard card -->
  <g>
    <rect x="720" y="340" width="410" height="220" rx="18" fill="#ffffff" stroke="#E3E6EB"/>
    <circle cx="800" cy="420" r="44" fill="none" stroke="#E6F4EA" stroke-width="10"/>
    <circle cx="800" cy="420" r="44" fill="none" stroke="#34A853" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="210 277" transform="rotate(-90 800 420)"/>
    <text x="800" y="430" text-anchor="middle" font-size="30" font-weight="800" fill="#12161F">76</text>
    <text x="800" y="492" text-anchor="middle" font-size="14" fill="#586172">Site sağlığı</text>

    <g font-size="15" font-weight="600">
      <text x="880" y="384" fill="#586172" font-weight="500" font-size="14">Google sırası</text>
      <text x="1110" y="384" text-anchor="end" fill="#12161F">4.</text>
      <text x="880" y="414" fill="#586172" font-weight="500" font-size="14">AI Overview</text>
      <text x="1110" y="414" text-anchor="end" fill="#188038">Kaynak</text>
      <text x="880" y="444" fill="#586172" font-weight="500" font-size="14">Lighthouse</text>
      <text x="1110" y="444" text-anchor="end" fill="#B06000">68</text>
    </g>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="744" y="508" width="84" height="32" rx="16" fill="#E6F4EA"/><text x="786" y="529" fill="#188038">ChatGPT</text>
      <rect x="836" y="508" width="84" height="32" rx="16" fill="#E6F4EA"/><text x="878" y="529" fill="#188038">Claude</text>
      <rect x="928" y="508" width="84" height="32" rx="16" fill="#FCE8E6"/><text x="970" y="529" fill="#C5221F">Gemini</text>
      <rect x="1020" y="508" width="92" height="32" rx="16" fill="#E8F0FE"/><text x="1066" y="529" fill="#1557B0">Perplexity</text>
    </g>
  </g>
  <text x="1130" y="600" text-anchor="end" font-size="18" fill="#586172">bahri.info</text>
</svg>
