# GitHub Container Registry'deki hazir imajla calistirma - kaynak kodu
# derlemeye gerek yok. Ayrintilar: docs/docker.md "Prebuilt images".
#
#   cp .env.docker.example .env   # APP_KEY ve diger degerleri doldurun
#   docker compose -f docker-compose.release.yml up -d
#
# Tek imaj: app nginx + php-fpm'i birlikte calistirir (port 80), worker ve
# scheduler ayni imaji farkli komutla kullanir. app her baslangicta
# migration'lari kendisi uygular (RUN_MIGRATIONS=false
# ile kapatilir).
#
# Surum sabitlemek icin .env'de SEO_AI_CHECKER_VERSION=1.0.0 (varsayilan: latest).

x-app: &app
  image: ${SEO_AI_CHECKER_IMAGE:-ghcr.io/bmericc/seo-ai-checker}:${SEO_AI_CHECKER_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    # APP_KEY .env'de zorunlu (bkz. docker/php/entrypoint.sh).
    SEO_AI_CHECKER_RELEASE: "1"
    # Veritabani kalici "storage" volume'unde durur.
    DB_CONNECTION: ${DB_CONNECTION:-sqlite}
    DB_DATABASE: ${RELEASE_DB_DATABASE:-/var/www/html/storage/database/database.sqlite}
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    ports:
      - "${WEB_PORT:-8080}:80"

  # Bos "storage" volume'unu ilk dolduran app olsun; ayni anda baslayan
  # container'lar Docker'in volume kopyalamasinda "file exists" ile duser.
  worker:
    <<: *app
    depends_on:
      - app
    command: ["php", "artisan", "queue:work", "--tries=2", "--sleep=3", "--max-time=3600"]

  scheduler:
    <<: *app
    depends_on:
      - app
    command: ["php", "artisan", "schedule:work"]

volumes:
  storage:
