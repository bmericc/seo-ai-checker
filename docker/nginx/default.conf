server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # app container'i yeniden olusturulunca IP'si degisir; nginx upstream'i
    # yalnizca acilista cozerse eski IP'ye gidip 502 verir. Docker DNS'i ile
    # degisken uzerinden her istekte (30 sn onbellekle) yeniden cozuyoruz.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Kontrol calistirmalari (SERP+on-page+Lighthouse) 60 saniyeyi
        # bulabilir; varsayilan zaman asimini artirin:
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
