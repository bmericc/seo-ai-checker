version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "composer"
    directory: "/www"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "weekly"
