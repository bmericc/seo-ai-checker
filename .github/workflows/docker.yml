name: Docker images

# v1.2.3 gibi bir tag push'lanınca app (php-fpm) ve web (nginx) imajlarini
# linux/amd64 + linux/arm64 olarak GitHub Container Registry'ye ve Docker
# Hub'a yayinlar:
#   ghcr.io/<owner>/seo-ai-checker      <dockerhub>/seo-ai-checker
#   ghcr.io/<owner>/seo-ai-checker-web  <dockerhub>/seo-ai-checker-web
# Etiketler: 1.2.3, 1.2, 1 ve latest.
#
# Docker Hub icin repo secret'lari: DOCKERHUB_USERNAME ve DOCKERHUB_TOKEN
# (hub.docker.com > Account settings > Personal access tokens, Read & Write).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seo-ai-checker
            dockerfile: docker/php/Dockerfile
            description: SEO / AI Overview Checker - Laravel app (php-fpm, queue worker, scheduler)
          - name: seo-ai-checker-web
            dockerfile: docker/nginx/Dockerfile
            description: SEO / AI Overview Checker - nginx front end

    name: ${{ matrix.name }}

    env:
      # Secret yoksa Docker Hub adimi atlanir, GHCR yine yayinlanir.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, matrix.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPOSER_INSTALL_FLAGS=--no-dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
