name: Docker images

# v1.2.3 gibi bir tag push'lanınca tek imaji (nginx + php-fpm, Dockerfile
# "release" hedefi) linux/amd64 + linux/arm64 olarak GitHub Container
# Registry'ye ve Docker Hub'a yayinlar:
#   ghcr.io/<owner>/seo-ai-checker      <dockerhub>/seo-ai-checker
# Etiketler: 1.2.3, 1.2, 1 ve latest.
#
# Docker Hub icin repo secret'lari: DOCKERHUB_USERNAME ve DOCKERHUB_TOKEN
# (hub.docker.com > Account settings > Personal access tokens, Read & Write).
#
# Imaj yayinlandiktan sonra "release" job'u ayni tag icin notlari
# CHANGELOG.md'den alinan bir GitHub Release olusturur (release zaten
# varsa atlanir). Tag'den once CHANGELOG'a o surumun bolumunu ekleyin.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: seo-ai-checker
      # Secret yoksa Docker Hub adimi atlanir, GHCR yine yayinlanir.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=SEO / AI Overview Checker - Laravel app with nginx, queue worker and scheduler
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPOSER_INSTALL_FLAGS=--no-dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Onceki tag'i bulup compare linki uretmek icin tum tag'ler lazim.
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/seo-ai-checker
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          # Notlar CHANGELOG.md / CHANGELOG.tr.md'deki "## [x.y.z]" bolumunden
          # gelir; bolum yoksa script hata verir ve release olusmaz.
          .github/scripts/release-notes.sh "$TAG" "$IMAGE" "$GH_REPO" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
